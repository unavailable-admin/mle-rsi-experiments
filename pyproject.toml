[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mle-rsi-platform"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["dream-rsi-lasso==0.26.0", "httpx==0.28.1", "docker==7.1.0", "psutil>=5", "numpy==2.2.6", "pandas>=2,<3", "scikit-learn==1.6.1", "Pillow>=10"]

[project.scripts]
mle-rsi = "mle_rsi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
mle_rsi = ["web_assets/*.html", "web_assets/*.js", "web_assets/*.css"]
